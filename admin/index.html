<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Оля Синякова</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Оля Синякова</span>
      <span class="brand-sub">админка</span>
    </div>
    <div class="topbar-right">
      <span class="save-state" data-save-state>Загрузка…</span>
      <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">Открыть сайт ↗</a>
      <button class="btn btn-ghost" type="button" data-action="publish">Опубликовать</button>
      <button class="btn btn-primary" type="button" data-action="save" disabled>Сохранить <kbd>⌘S</kbd></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <p class="label">Проекты</p>
        <button class="btn btn-small" type="button" data-action="new-project">+ Новый</button>
      </div>
      <p class="hint">Перетаскивай, чтобы поменять порядок на сайте.</p>
      <ul class="project-list" data-project-list></ul>
      <button class="sidebar-link sidebar-link--first" type="button" data-action="hero-order">Первый экран</button>
      <button class="sidebar-link" type="button" data-action="gallery-order">Порядок в галерее</button>
      <button class="sidebar-link" type="button" data-action="categories">Категории</button>
    </aside>

    <main class="editor" data-editor>
      <div class="empty">Выбери проект слева или создай новый.</div>
    </main>
  </div>

  <div class="toasts" data-toasts aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
